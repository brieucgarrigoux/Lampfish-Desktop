<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lampfish dusk</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #03080a; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script src="https://app.example/app/ui/mark-data.js"></script>
<script src="https://app.example/app/ui/mark-swim.js"></script>
<script>
// Dusk under water: the light comes from below like a lit surface, where ripples of light dance, marine snow drifts down
// in three depths, and a small fish crosses slowly with its lamp lit.
(() => {
  const params = new URLSearchParams(location.search);
  const thumbnail = params.has('thumbnail');
  let light = 1, speed = 1, frozen = false, audio = 0, audioTarget = 0;
  window.__adjust = (l, v) => { light = Number(l) / 50; speed = Math.pow(2, (Number(v) - 50) / 25); };
  window.__adjust(params.get('light') ?? 50, params.get('speed') ?? 50);
  window.__audio = l => { audioTarget = Number(l); };
  addEventListener('message', e => {
    const m = e.data || {};
    if (m.lampfish === 'adjust') window.__adjust(m.light, m.speed);
    if (m.lampfish === 'freeze') frozen = m.value;
    if (m.lampfish === 'audio') window.__audio(m.level);
  });
  if (parent !== window) parent.postMessage({ lampfish: 'ready' }, '*');

  const TAU = Math.PI * 2;
  const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
  const fish = MarkSwim ? MarkSwim.swimmer() : null;
  // The ripples of light are computed small and drawn large: they are soft by nature.
  const ripples = document.createElement('canvas'), rg = ripples.getContext('2d');
  ripples.width = 144; ripples.height = 48;
  let rippleTurn = 0;
  const image = rg.createImageData(ripples.width, ripples.height);
  let w = 0, h = 0, snow = [], backdrop = null, sprites = new Map();
  const rnd = (a, b) => a + Math.random() * (b - a);

  function sprite(key, stops) {
    if (sprites.has(key)) return sprites.get(key);
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d'), q = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    for (const [at, color] of stops) q.addColorStop(at, color);
    g.fillStyle = q; g.fillRect(0, 0, 128, 128);
    sprites.set(key, c); return c;
  }
  const halo = () => sprite('halo', [[0, 'rgba(190,245,238,.9)'], [.35, 'rgba(190,245,238,.3)'], [1, 'rgba(190,245,238,0)']]);
  const bokeh = () => sprite('bokeh', [[0, 'rgba(150,235,225,.8)'], [.62, 'rgba(150,235,225,.55)'], [1, 'rgba(150,235,225,0)']]);
  const put = (img, x, y, r, a) => { ctx.globalAlpha = a; ctx.drawImage(img, x - r, y - r, r * 2, r * 2); };
  const glow = (x, y, r, rgb, a) => { const q = ctx.createRadialGradient(x, y, 0, x, y, r); q.addColorStop(0, `rgba(${rgb},${a})`); q.addColorStop(.45, `rgba(${rgb},${a * .35})`); q.addColorStop(1, `rgba(${rgb},0)`); ctx.globalAlpha = 1; ctx.fillStyle = q; ctx.fillRect(x - r, y - r, r * 2, r * 2); };

  function resize() {
    const r = devicePixelRatio || 1;
    w = innerWidth; h = innerHeight;
    canvas.width = Math.round(w * r); canvas.height = Math.round(h * r);
    ctx.setTransform(r, 0, 0, r, 0, 0);
    // The water, painted once: deep at the top, warmer teal towards the lit surface, a haze in the middle, dark edges.
    backdrop = document.createElement('canvas');
    backdrop.width = canvas.width; backdrop.height = canvas.height;
    const b = backdrop.getContext('2d'); b.setTransform(r, 0, 0, r, 0, 0);
    const water = b.createLinearGradient(0, 0, 0, h);
    water.addColorStop(0, '#02070a'); water.addColorStop(.38, '#04141a'); water.addColorStop(.7, '#082d31'); water.addColorStop(.9, '#0e4a4b'); water.addColorStop(1, '#14625e');
    b.fillStyle = water; b.fillRect(0, 0, w, h);
    const haze = b.createRadialGradient(w * .5, h * 1.05, h * .05, w * .5, h * 1.05, h * .95);
    haze.addColorStop(0, 'rgba(70,200,185,.28)'); haze.addColorStop(.5, 'rgba(30,140,135,.1)'); haze.addColorStop(1, 'rgba(30,140,135,0)');
    b.fillStyle = haze; b.fillRect(0, 0, w, h);
    const sides = b.createLinearGradient(0, 0, w, 0);
    sides.addColorStop(0, 'rgba(0,0,0,.45)'); sides.addColorStop(.25, 'rgba(0,0,0,0)'); sides.addColorStop(.75, 'rgba(0,0,0,0)'); sides.addColorStop(1, 'rgba(0,0,0,.45)');
    b.fillStyle = sides; b.fillRect(0, 0, w, h);
    const n = Math.round(w * h / 100000 * 20) + 10;
    snow = Array.from({ length: n }, () => ({ x: rnd(0, w), y: rnd(0, h), z: Math.random() < .55 ? 0 : Math.random() < .88 ? 1 : 2, ph: rnd(0, TAU), vy: rnd(.6, 1.4) }));
  }

  // Ripples of light: crossing waves whose crests meet in thin bright lines, as light through a moving surface.
  // Computed on every other frame, the sines of a row and of a column only once: the same picture for a tenth of the work.
  const rowWave = new Float32Array(48), colWave = new Float32Array(144);
  function rippleLight(t) {
    if (rippleTurn++ % 2) return;
    const W = ripples.width, H = ripples.height, d = image.data;
    for (let y = 0; y < H; y++) rowWave[y] = Math.sin(y / H * 3 * 2.1 + t * .4) * 1.4;
    for (let x = 0; x < W; x++) colWave[x] = Math.sin(x / W * 9 * .6 - t * .3) * 1.2;
    for (let y = 0; y < H; y++) {
      const v = y / H * 3, fade = 255 * (y / H);
      for (let x = 0; x < W; x++) {
        const u = x / W * 9;
        const a = Math.sin(u * 1.3 + t * .9 + rowWave[y]);
        const b = Math.sin(u * .9 - v * 1.7 - t * .7 + colWave[x]);
        const c = Math.sin((u + v) * .8 + t * .5);
        let k = 1 - Math.abs(a + b + c) / 3;
        if (k < 0) k = 0;
        const k2 = k * k, k4 = k2 * k2;
        const i = (y * W + x) * 4;
        d[i] = 150; d[i + 1] = 245; d[i + 2] = 232; d[i + 3] = fade * k4 * k2 * k;
      }
    }
    rg.putImageData(image, 0, 0);
  }

  let t = 0, before = performance.now(), frames = 0;
  function draw(now) {
    if (innerWidth !== w || innerHeight !== h) resize();
    if (frozen) { before = now; setTimeout(() => requestAnimationFrame(draw), 250); return; }
    if (now - before < 1000 / 62) { requestAnimationFrame(draw); return; }
    const dt = Math.min(.05, (now - before) / 1000) * speed;
    before = now; t += dt;
    audio += (audioTarget - audio) * Math.min(1, dt * 14);
    const lit = Math.min(1.6, light) * (1 + audio * .35);

    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.drawImage(backdrop, 0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';
    rippleLight(t * .8);
    ctx.globalAlpha = .55 * lit;
    ctx.drawImage(ripples, 0, h * .58, w, h * .42);
    ctx.globalAlpha = 1;
    // Marine snow in three depths, drifting down; the near flakes are large and out of focus.
    for (const p of snow) {
      const v = [5, 13, 28][p.z];
      p.y += v * p.vy * dt; p.x += Math.sin(t * .35 + p.ph) * (4 + p.z * 6) * dt;
      const m = p.z === 2 ? 60 : 20;
      if (p.y > h + m) { p.y = -m; p.x = rnd(0, w); }
      const a = (.6 + .4 * Math.sin(t * (.8 + p.z * .5) + p.ph)) * Math.min(1, .5 + p.y / h) * lit;
      if (p.z === 0) { ctx.globalAlpha = a * .4; ctx.fillStyle = 'rgb(170,235,228)'; ctx.beginPath(); ctx.arc(p.x, p.y, .7, 0, TAU); ctx.fill(); }
      else if (p.z === 1) { put(halo(), p.x, p.y, 4.5, a * .35); ctx.globalAlpha = a * .85; ctx.fillStyle = '#E9FFFB'; ctx.beginPath(); ctx.arc(p.x, p.y, 1, 0, TAU); ctx.fill(); }
      else put(bokeh(), p.x, p.y, 20, a * .13);
    }
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    // The small fish crosses the lower third from left to right, rising and sinking a little.
    if (fish) {
      const pose = fish.step(dt, false), size = Math.min(w, h) * .15, span = w + size * 2;
      const x = ((t * w * .022) % span) - size, y = h * .66 - size / 2 + Math.sin(t * .5) * h * .02;
      MarkSwim.draw(ctx, pose, x, y, size, 'rgba(236,250,248,.92)', '#E9FFFB');
      const [lx, ly] = MarkSwim.lampAt(pose, x, y, size);
      ctx.globalCompositeOperation = 'lighter';
      glow(lx, ly, size * .3, '46,217,198', .5 * Math.min(1.4, lit));
      ctx.globalCompositeOperation = 'source-over';
    }
    if (thumbnail && ++frames > 2) return;
    requestAnimationFrame(draw);
  }
  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
