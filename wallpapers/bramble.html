<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bramble</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(120% 90% at 30% 20%, #150b28, #05030a 70%); }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>

  const params = new URLSearchParams(location.search);
  const thumbnail = params.has('thumbnail');
  let light, speed, frozen = false;
  window.__adjust = (l, v) => { light = Number(l) / 50; speed = Math.pow(2, (Number(v) - 50) / 25); };
  window.__adjust(params.get('light') ?? 50, params.get('speed') ?? 50);
  addEventListener('message', e => {
    const m = e.data || {};
    if (m.bramble === 'adjust') window.__adjust(m.light, m.speed);
    if (m.bramble === 'freeze') frozen = m.value;
  });
  if (parent !== window) parent.postMessage({ bramble: 'ready' }, '*');

  const canvas = document.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const TINTS = [['#8d60e2', '#361666', '#0c031e'], ['#7f66e9', '#2f1969', '#090320'], ['#9a5bda', '#3d1261', '#0f021d']];
  const LEVELS = 6;
  let w, h, grains, sprites;

  function sprite(tint, blur) {
    const r = 64, margin = blur * 2 + 4, c = document.createElement('canvas');
    c.width = c.height = (r + margin) * 2;
    const g = c.getContext('2d');
    g.filter = blur ? `blur(${blur}px)` : 'none';
    const cx = r + margin;
    const wallpaper = g.createRadialGradient(cx - r * .3, cx - r * .35, r * .1, cx, cx, r);
    wallpaper.addColorStop(0, tint[0]); wallpaper.addColorStop(.6, tint[1]); wallpaper.addColorStop(1, tint[2]);
    g.fillStyle = wallpaper; g.beginPath(); g.arc(cx, cx, r, 0, Math.PI * 2); g.fill();
    const caustic = g.createRadialGradient(cx + r * .35, cx + r * .45, 0, cx + r * .35, cx + r * .45, r * .5);
    caustic.addColorStop(0, 'rgba(188, 143, 255, .55)'); caustic.addColorStop(1, 'rgba(188, 143, 255, 0)');
    g.fillStyle = caustic; g.beginPath(); g.arc(cx, cx, r, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255, 255, 255, .85)';
    g.beginPath(); g.ellipse(cx - r * .38, cx - r * .42, r * .2, r * .13, -.6, 0, Math.PI * 2); g.fill();
    return { c, r, margin };
  }

  function resize() {
    const old = [w, h];
    w = canvas.width = innerWidth; h = canvas.height = innerHeight;
    if (!grains) return;
    if (old[0] && old[1]) for (const g of grains) { g.x *= w / old[0]; g.y *= h / old[1]; }
    else if (w && h) { grains = grains.map(() => fresh(true)); grains.sort((a, b) => a.z - b.z); }
  }

  function start() {
    resize();
    sprites = TINTS.map(t => Array.from({ length: LEVELS }, (_, k) => sprite(t, k * 3)));
    grains = Array.from({ length: Math.round(28 + w * h / 90000) }, () => fresh(true));
    grains.sort((a, b) => a.z - b.z);
  }

  function fresh(everywhere) {
    const z = Math.random();
    return {
      z, x: Math.random() * w, y: everywhere ? Math.random() * h : h + 120,
      size: 6 + z * z * 70, tint: Math.floor(Math.random() * TINTS.length),
      phase: Math.random() * Math.PI * 2, speed: 6 + z * 18,
    };
  }

  let previous = 0, images = 0, t = 0;
  function animate(time) {
    if (thumbnail && ++images > 2) return;
    if (innerWidth !== w || innerHeight !== h) resize();
    requestAnimationFrame(animate);
    if (time - previous < 33) return;
    const dt = Math.min(.05, (time - previous) / 1000);
    previous = time;
    if (frozen) return;
    render(dt);
  }

  function render(dt) {
    t += dt * speed;
    ctx.clearRect(0, 0, w, h);
    for (const g of grains) {
      g.y -= g.speed * dt * speed;
      const x = g.x + Math.sin(t * .3 + g.phase) * (10 + g.z * 30);
      if (g.y < -150) Object.assign(g, fresh(false));

      const level = Math.min(LEVELS - 1, Math.round(Math.abs(g.z - .35) * 9));
      const s = sprites[g.tint][level], k = g.size / s.r;
      ctx.globalAlpha = Math.min(1, (.25 + g.z * .55) * light) * (1 - level * .08);
      const d = (s.r + s.margin) * k;
      ctx.drawImage(s.c, x - d, g.y - d, d * 2, d * 2);
    }
    ctx.globalAlpha = 1;
  }

  addEventListener('resize', () => { resize(); render(0); });
  start();
  render(0);
  requestAnimationFrame(animate);
</script>
</body>
</html>
