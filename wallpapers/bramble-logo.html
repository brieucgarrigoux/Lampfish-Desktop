<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bramble logo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07060b; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .scene { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 2.4vmin; transform: translateY(-2vmin); }
  .brand img { width: 21vmin; height: 21vmin; object-fit: contain; }
  .brand span { font: 600 6.4vmin/1 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; letter-spacing: -.02em; color: #ece7f4;
    text-shadow: 0 .4vmin 2vmin rgba(0, 0, 0, .5); }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="scene"><div class="brand" id="brand"><img src="https://app.example/brand/logo/berry-color.png" alt=""><span>Bramble</span></div></div>
<script>

(() => {
  const params = new URLSearchParams(location.search);
  const thumbnail = params.has('thumbnail');
  let light = 1, speed = 1, frozen = false;
  window.__adjust = (l, v) => { light = Number(l) / 50; speed = Math.pow(2, (Number(v) - 50) / 25); };
  window.__adjust(params.get('light') ?? 50, params.get('speed') ?? 50);
  let audio = 0, audioTarget = 0, lastRaw = 0, lastBeat = 0;
  window.__audio = l => {
    l = Number(l);
    const now = performance.now();
    if (window.__beat && l - lastRaw > .12 && l > .25 && now - lastBeat > 170) { lastBeat = now; window.__beat(l); }
    lastRaw = l;
    audioTarget = l;
  };
  addEventListener('message', e => {
    const m = e.data || {};
    if (m.bramble === 'adjust') window.__adjust(m.light, m.speed);
    if (m.bramble === 'freeze') frozen = m.value;
  });
  if (parent !== window) parent.postMessage({ bramble: 'ready' }, '*');

  const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d'), brand = document.getElementById('brand');
  let w = 0, h = 0, grains = [];
  function resize() {
    const r = devicePixelRatio || 1;
    w = innerWidth; h = innerHeight;
    canvas.width = w * r; canvas.height = h * r;
    ctx.setTransform(r, 0, 0, r, 0, 0);
    grains = Array.from({ length: Math.round(w * h / 9000) }, () => freshGrain(true));
  }
  function freshGrain(everywhere) {
    const z = Math.random();
    return { x: Math.random() * w, y: everywhere ? Math.random() * h : h + 10, z, r: .6 + z * 1.8, v: 5 + z * 16, phase: Math.random() * 6.3 };
  }

  const ripples = [];
  window.__beat = l => { if (ripples.length < 8) ripples.push({ age: 0, power: l }); };

  function ring(dt) {
    const cx = w / 2, cy = h * .45, base = Math.min(w, h) * .165;
    if (audio > .02) {
      ctx.beginPath();
      ctx.arc(cx, cy, base * (1.08 + audio * .12), 0, 6.283);
      ctx.strokeStyle = `rgba(201, 162, 230, ${(.08 + audio * .32).toFixed(3)})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.age += dt;
      const k = r.age / 1.5;
      if (k >= 1) { ripples.splice(i, 1); continue; }
      const eased = 1 - Math.pow(1 - k, 3);
      ctx.beginPath();
      ctx.arc(cx, cy, base * (1.1 + eased * (1.6 + r.power)), 0, 6.283);
      ctx.strokeStyle = `rgba(201, 162, 230, ${((1 - k) * (.22 + r.power * .4)).toFixed(3)})`;
      ctx.lineWidth = 1 + (1 - k) * 2.2 * r.power;
      ctx.stroke();
    }
  }

  let t = 0, before = performance.now(), images = 0;
  function draw(now) {

    if (innerWidth !== w || innerHeight !== h) resize();
    const dt = Math.min(.05, (now - before) / 1000);
    before = now;
    audio += (audioTarget - audio) * Math.min(1, dt * 14);
    if (!frozen) t += dt * speed;

    const wallpaper = ctx.createRadialGradient(w / 2, h * .46, 0, w / 2, h * .46, Math.max(w, h) * .75);
    wallpaper.addColorStop(0, '#1a0f24');
    wallpaper.addColorStop(.55, '#0c0912');
    wallpaper.addColorStop(1, '#050408');
    ctx.fillStyle = wallpaper;
    ctx.fillRect(0, 0, w, h);

    const whoosh = .82 + Math.sin(t * .9) * .18;
    const rh = Math.min(w, h) * .42 * whoosh * (1 + audio * .7);
    const halo = ctx.createRadialGradient(w / 2, h * .45, 0, w / 2, h * .45, rh);
    halo.addColorStop(0, `rgba(142, 66, 182, ${.42 * Math.min(1.6, light) * (1 + audio * 2)})`);
    halo.addColorStop(.5, `rgba(110, 42, 138, ${.16 * Math.min(1.6, light)})`);
    halo.addColorStop(1, 'rgba(110, 42, 138, 0)');
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, w, h);

    for (const g of grains) {
      if (!frozen) { g.y -= g.v * dt * speed * (1 + audio * 5); g.x += Math.sin(t * .6 + g.phase) * .15 * speed; }
      if (g.y < -10) Object.assign(g, freshGrain(false));
      ctx.globalAlpha = Math.min(1, (.18 + g.z * .5) * light) * (.6 + .4 * Math.sin(t * 2 + g.phase));
      ctx.fillStyle = g.z > .7 ? '#c9a2e6' : '#8e42b6';
      ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ring(dt);
    brand.style.transform = `translateY(${(-2 + Math.sin(t * .7) * .6).toFixed(3)}vmin) scale(${(1 + audio * .07).toFixed(3)})`;
    if (thumbnail && ++images > 2) return;
    requestAnimationFrame(draw);
  }
  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
