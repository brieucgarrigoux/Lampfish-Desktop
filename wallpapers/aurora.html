<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aurora</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #03040a; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>

  const params = new URLSearchParams(location.search);
  const thumbnail = params.has('thumbnail');
  let images = 0;
  let light, speed, frozen = false;
  window.__adjust = (l, v) => { light = Number(l) / 50; speed = Math.pow(2, (Number(v) - 50) / 25); };
  window.__adjust(params.get('light') ?? 50, params.get('speed') ?? 50);
  let audio = 0, audioTarget = 0, lastRaw = 0, lastBeat = 0;
  window.__audio = l => {
    l = Number(l);
    const now = performance.now();
    if (window.__beat && l - lastRaw > .12 && l > .25 && now - lastBeat > 170) { lastBeat = now; window.__beat(l); }
    lastRaw = l;
    audioTarget = l;
  };

  addEventListener('message', e => {
    const m = e.data || {};
    if (m.bramble === 'adjust') window.__adjust(m.light, m.speed);
    if (m.bramble === 'freeze') frozen = m.value;
    if (m.bramble === 'audio') window.__audio(m.level);
  });
  if (parent !== window) parent.postMessage({ bramble: 'ready' }, '*');
  const canvas = document.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const scale = 0.25;
  const curtains = [
    { tint: 155, y: 0.42, amplitude: 0.10, speed: 0.00011, phase: 0 },
    { tint: 190, y: 0.50, amplitude: 0.13, speed: 0.00008, phase: 2 },
    { tint: 265, y: 0.58, amplitude: 0.09, speed: 0.00013, phase: 4 },
  ];

  function resize() {
    canvas.width = Math.round(innerWidth * scale);
    canvas.height = Math.round(innerHeight * scale);
  }

  addEventListener('resize', () => { resize(); paint(); });
  resize();

  let previous = 0, t = 0;
  function draw(time) {
    if (thumbnail && ++images > 8) return;
    if (canvas.width !== Math.round(innerWidth * scale) || canvas.height !== Math.round(innerHeight * scale)) resize();
    requestAnimationFrame(draw);
    if (time - previous < 33) return;
    audio += (audioTarget - audio) * Math.min(1, (time - previous) / 70);
    if (!frozen) t += Math.min(time - previous, 100) * speed * (1 + audio * 4);
    previous = time;
    paint();
  }

  function paint() {
    const { width: w, height: h } = canvas;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#03040a';
    ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';
    for (const r of curtains) {
      for (let x = 0; x <= w; x += 2) {
        const u = x / w;
        const wave = Math.sin(u * 5 + t * r.speed * 10 + r.phase) * 0.6 + Math.sin(u * 11 - t * r.speed * 17) * 0.4;
        const center = (r.y + wave * r.amplitude) * h;
        const height = h * (0.18 + 0.1 * Math.sin(u * 7 + t * r.speed * 6 + r.phase));
        const intensity = (0.10 + 0.08 * Math.sin(u * 9 + t * r.speed * 12)) * light * (1 + audio * 3);
        const g = ctx.createLinearGradient(0, center - height, 0, center + height * 0.4);
        g.addColorStop(0, `hsla(${r.tint}, 90%, 55%, 0)`);
        g.addColorStop(0.75, `hsla(${r.tint}, 90%, 60%, ${intensity})`);
        g.addColorStop(1, `hsla(${r.tint + 20}, 90%, 70%, 0)`);
        ctx.fillStyle = g;
        ctx.fillRect(x, center - height, 2, height * 1.4);
      }
    }
  }
  requestAnimationFrame(draw);
</script>
</body>
</html>
