<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aurora</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #02030a; }
  canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  #sky { filter: saturate(1.2); }
  .shoot { position: fixed; width: 14vmin; height: 1.5px; border-radius: 1px; background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .9)); transform-origin: right center; opacity: 0; pointer-events: none; animation: shoot 1.1s ease-out forwards; }
  @keyframes shoot { 0% { opacity: 0; transform: rotate(var(--angle)) translateX(0); } 12% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--angle)) translateX(36vmin); } }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="stars"></canvas>
<script>

  const params = new URLSearchParams(location.search);
  const thumbnail = params.has('thumbnail');
  let light, speed, frozen = false, dirty = true;
  window.__adjust = (l, v) => { light = Number(l) / 50; speed = Math.pow(2, (Number(v) - 50) / 25); dirty = true; };
  window.__adjust(params.get('light') ?? 50, params.get('speed') ?? 50);
  let audio = 0, audioTarget = 0;
  window.__audio = l => { audioTarget = Number(l); };

  addEventListener('message', e => {
    const m = e.data || {};
    if (m.lampfish === 'adjust') window.__adjust(m.light, m.speed);
    if (m.lampfish === 'freeze') { frozen = m.value; dirty = true; }
    if (m.lampfish === 'audio') window.__audio(m.level);
  });
  if (parent !== window) parent.postMessage({ lampfish: 'ready' }, '*');

  const sky = document.getElementById('sky'), field = document.getElementById('stars');
  const ctx = sky.getContext('2d'), night = field.getContext('2d');
  const SCALE = 0.3;
  const RIBBONS = [
    { hue: 150, y: .40, amplitude: .10, speed: .00010, phase: 0, reach: .22, power: 1 },
    { hue: 178, y: .50, amplitude: .13, speed: .00007, phase: 2.1, reach: .26, power: .85 },
    { hue: 268, y: .58, amplitude: .09, speed: .00012, phase: 4.2, reach: .2, power: .7 },
    { hue: 205, y: .46, amplitude: .08, speed: .00005, phase: 1.1, reach: .3, power: .45 },
  ];
  let w, h;

  function rnd(seed) { const x = Math.sin(seed * 127.1) * 43758.5453; return x - Math.floor(x); }

  function paintStars() {
    field.width = w; field.height = h;
    for (let i = 0; i < 160; i++) {
      const x = rnd(i + 1) * w, y = Math.pow(rnd(i + 300), 1.6) * h * .8, r = .4 + rnd(i + 600) * 1.0;
      night.globalAlpha = .18 + rnd(i + 900) * .6;
      night.fillStyle = rnd(i + 1500) > .8 ? '#bcd0ff' : '#ffffff';
      night.beginPath(); night.arc(x, y, r, 0, 6.283); night.fill();
    }
  }

  function resize() {
    w = innerWidth; h = innerHeight;
    sky.width = Math.max(1, Math.round(w * SCALE)); sky.height = Math.max(1, Math.round(h * SCALE));
    paintStars();
  }

  addEventListener('resize', () => { resize(); paint(); });
  resize();

  let previous = 0, t = 0, images = 0;
  function draw(time) {
    if (innerWidth !== w || innerHeight !== h) resize();
    if (thumbnail && w && h && ++images > 8) return;
    if (frozen && !dirty) { setTimeout(() => requestAnimationFrame(draw), 250); return; }
    requestAnimationFrame(draw);
    if (time - previous < 33) return;
    const dt = Math.min(time - previous, 100);
    audio += (audioTarget - audio) * Math.min(1, dt / 70);
    if (!frozen) t += dt * speed * (1 + audio * 3);
    previous = time;
    dirty = false;
    paint();
  }

  function centre(r, u) {
    const wave = Math.sin(u * 5 + t * r.speed * 10 + r.phase) * .6 + Math.sin(u * 11 - t * r.speed * 17) * .4;
    return r.y + wave * r.amplitude;
  }

  function paint() {
    const { width: cw, height: ch } = sky;
    if (!w || !h) return;
    ctx.globalCompositeOperation = 'source-over';
    const bg = ctx.createLinearGradient(0, 0, 0, ch);
    bg.addColorStop(0, '#02030a'); bg.addColorStop(.65, '#040815'); bg.addColorStop(1, '#091226');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, cw, ch);
    ctx.globalCompositeOperation = 'lighter';
    for (const r of RIBBONS) {
      for (let x = 0; x <= cw; x += 2) {
        const u = x / cw;
        const bottom = centre(r, u) * ch;
        const reach = ch * r.reach * (1 + .35 * Math.sin(u * 7 + t * r.speed * 6 + r.phase));
        const swell = .5 + .5 * Math.sin(u * 4 + t * r.speed * 8 + r.phase);
        const shimmer = .93 + .07 * Math.sin(u * 190 + Math.sin(u * 8 + t * r.speed * 12) * 4 + r.phase);
        const a = Math.min(.95, (.13 + .24 * swell) * shimmer * r.power * light * (1 + audio * 2.8));
        const g = ctx.createLinearGradient(0, bottom - reach, 0, bottom + reach * .25);
        g.addColorStop(0, `hsla(${r.hue + 25}, 90%, 60%, 0)`);
        g.addColorStop(.22, `hsla(${r.hue + 120}, 80%, 58%, ${a * .12})`);
        g.addColorStop(.7, `hsla(${r.hue + 8}, 92%, 58%, ${a * .55})`);
        g.addColorStop(.92, `hsla(${r.hue}, 95%, 64%, ${a})`);
        g.addColorStop(1, `hsla(${r.hue - 12}, 95%, 72%, 0)`);
        ctx.fillStyle = g;
        ctx.fillRect(x, bottom - reach, 2, reach * 1.25);
      }
      ctx.beginPath();
      for (let x = 0; x <= cw; x += 3) {
        const y = centre(r, x / cw) * ch;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = `hsla(${r.hue}, 95%, 72%, ${Math.min(.5, .12 * r.power * light * (1 + audio * 2))})`;
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  requestAnimationFrame(draw);

  function shoot() {
    if (!frozen && !thumbnail && document.visibilityState === 'visible') {
      const star = document.createElement('i');
      star.className = 'shoot';
      star.style.left = (15 + Math.random() * 60) + 'vw';
      star.style.top = (4 + Math.random() * 22) + 'vh';
      star.style.setProperty('--angle', (18 + Math.random() * 14) + 'deg');
      document.body.append(star);
      setTimeout(() => star.remove(), 1300);
    }
    setTimeout(shoot, 9000 + Math.random() * 9000);
  }
  if (!thumbnail) setTimeout(shoot, 4000);
</script>
</body>
</html>
