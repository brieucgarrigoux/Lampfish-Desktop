<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bramble</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05030d; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>

  const params = new URLSearchParams(location.search);
  const thumbnail = params.has('thumbnail');
  let light, speed, frozen = false;
  window.__adjust = (l, v) => { light = Number(l) / 50; speed = Math.pow(2, (Number(v) - 50) / 25); };
  window.__adjust(params.get('light') ?? 50, params.get('speed') ?? 50);
  let audio = 0, audioTarget = 0;
  window.__audio = l => { audioTarget = Number(l); };
  addEventListener('message', e => {
    const m = e.data || {};
    if (m.bramble === 'adjust') window.__adjust(m.light, m.speed);
    if (m.bramble === 'freeze') frozen = m.value;
    if (m.bramble === 'audio') window.__audio(m.level);
  });
  if (parent !== window) parent.postMessage({ bramble: 'ready' }, '*');

  const canvas = document.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const TINTS = [['#a47bf0', '#4a1d8f', '#12052b'], ['#8f7cf2', '#3a2299', '#0d0430'], ['#b36ee0', '#4d1a80', '#14042b']];
  const LEVELS = 6;
  const HAZE = [[.28, .3, .55, [124, 72, 230], .2, .07, 0], [.72, .68, .6, [70, 52, 210], .17, .05, 2], [.5, .9, .5, [180, 70, 200], .11, .09, 4]];
  let w, h, grains, dust, sprites, backdrop, vignette;

  function sprite(tint, blur) {
    const r = 64, margin = blur * 2 + 4, c = document.createElement('canvas');
    c.width = c.height = (r + margin) * 2;
    const g = c.getContext('2d');
    g.filter = blur ? `blur(${blur}px)` : 'none';
    const cx = r + margin;
    const body = g.createRadialGradient(cx - r * .3, cx - r * .35, r * .1, cx, cx, r);
    body.addColorStop(0, tint[0]); body.addColorStop(.6, tint[1]); body.addColorStop(1, tint[2]);
    g.fillStyle = body; g.beginPath(); g.arc(cx, cx, r, 0, Math.PI * 2); g.fill();
    const caustic = g.createRadialGradient(cx + r * .35, cx + r * .45, 0, cx + r * .35, cx + r * .45, r * .55);
    caustic.addColorStop(0, 'rgba(196, 150, 255, .6)'); caustic.addColorStop(1, 'rgba(196, 150, 255, 0)');
    g.fillStyle = caustic; g.beginPath(); g.arc(cx, cx, r, 0, Math.PI * 2); g.fill();
    g.strokeStyle = 'rgba(214, 190, 255, .35)'; g.lineWidth = r * .04;
    g.beginPath(); g.arc(cx, cx, r * .96, 0, Math.PI * 2); g.stroke();
    g.fillStyle = 'rgba(255, 255, 255, .85)';
    g.beginPath(); g.ellipse(cx - r * .38, cx - r * .42, r * .2, r * .13, -.6, 0, Math.PI * 2); g.fill();
    return { c, r, margin };
  }

  function paintStatic() {
    backdrop = document.createElement('canvas');
    backdrop.width = w; backdrop.height = h;
    const b = backdrop.getContext('2d');
    const base = b.createLinearGradient(0, 0, w * .4, h);
    base.addColorStop(0, '#190b33'); base.addColorStop(.55, '#0a0518'); base.addColorStop(1, '#03020a');
    b.fillStyle = base; b.fillRect(0, 0, w, h);
    vignette = document.createElement('canvas');
    vignette.width = w; vignette.height = h;
    const v = vignette.getContext('2d');
    const edge = v.createRadialGradient(w / 2, h / 2, Math.min(w, h) * .35, w / 2, h / 2, Math.hypot(w, h) * .55);
    edge.addColorStop(0, 'rgba(2, 1, 8, 0)'); edge.addColorStop(1, 'rgba(2, 1, 8, .7)');
    v.fillStyle = edge; v.fillRect(0, 0, w, h);
  }

  function seed() {
    grains = Array.from({ length: Math.round(26 + w * h / 100000) }, () => fresh(true));
    grains.sort((a, b) => a.z - b.z);
  }

  // A page loaded while hidden starts at zero size: its bubbles are spread again once it has a real size.
  function resize() {
    const old = [w, h];
    w = canvas.width = innerWidth; h = canvas.height = innerHeight;
    paintStatic();
    if (!sprites || !w || !h) return;
    if (!grains || !old[0] || !old[1]) seed();
    else for (const g of grains) { g.x *= w / old[0]; g.y *= h / old[1]; }
  }

  function fresh(everywhere) {
    const z = Math.random();
    return {
      z, x: Math.random() * w, y: everywhere ? Math.random() * h : h + 140,
      size: (8 + z * z * 80) * (thumbnail ? 1.5 : 1.12), tint: Math.floor(Math.random() * TINTS.length),
      phase: Math.random() * Math.PI * 2, speed: 5 + z * 16,
    };
  }

  function start() {
    resize();
    sprites = TINTS.map(t => Array.from({ length: LEVELS }, (_, k) => sprite(t, k * 3)));
    if (w && h) seed();
    dust = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), r: .5 + Math.random() * 1.3, drift: .004 + Math.random() * .012, phase: Math.random() * 6.28 }));
  }

  let previous = 0, images = 0, t = 0;
  function animate(time) {
    if (innerWidth !== w || innerHeight !== h) resize();
    if (thumbnail && w && h && ++images > 2) return;
    requestAnimationFrame(animate);
    if (time - previous < 33) return;
    const dt = Math.min(.05, (time - previous) / 1000);
    previous = time;
    if (frozen) return;
    render(dt);
  }

  function render(dt) {
    if (!w || !h || !grains) return;
    audio += (audioTarget - audio) * Math.min(1, dt * 14);
    t += dt * speed * (1 + audio * 1.2);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.drawImage(backdrop, 0, 0);

    ctx.globalCompositeOperation = 'lighter';
    const reach = Math.max(w, h);
    for (const [x, y, size, [r, g, b], alpha, drift, offset] of HAZE) {
      const cx = (x + Math.sin(t * .08 + offset) * drift * 2) * w, cy = (y + Math.cos(t * .06 + offset) * drift * 2) * h;
      const haze = ctx.createRadialGradient(cx, cy, 0, cx, cy, reach * size);
      const a = Math.min(.5, alpha * light * (1 + audio * 1.2));
      haze.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${a})`); haze.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
      ctx.fillStyle = haze; ctx.fillRect(0, 0, w, h);
    }

    ctx.globalCompositeOperation = 'source-over';
    for (const g of grains) {
      g.y -= g.speed * dt * speed * (1 + audio * 5);
      const x = g.x + Math.sin(t * .3 + g.phase) * (10 + g.z * 30);
      if (g.y < -170) Object.assign(g, fresh(false));
      const level = Math.min(LEVELS - 1, Math.round(Math.abs(g.z - .35) * 9));
      const s = sprites[g.tint][level], k = g.size / s.r;
      ctx.globalAlpha = Math.min(1, (.3 + g.z * .6) * light * (1 + audio * 1.5)) * (1 - level * .08);
      const d = (s.r + s.margin) * k * (1 + audio * .3);
      ctx.drawImage(s.c, x - d, g.y - d, d * 2, d * 2);
    }

    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = '#d8c4ff';
    for (const p of dust) {
      p.y -= p.drift * dt * speed;
      if (p.y < -.02) p.y = 1.02;
      ctx.globalAlpha = Math.min(1, (.12 + .3 * (.5 + .5 * Math.sin(t * 1.4 + p.phase))) * light * (1 + audio * 2));
      ctx.beginPath(); ctx.arc((p.x + Math.sin(t * .2 + p.phase) * .01) * w, p.y * h, p.r, 0, 6.283); ctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.drawImage(vignette, 0, 0);
  }

  addEventListener('resize', () => { resize(); render(0); });
  start();
  render(0);
  requestAnimationFrame(animate);
</script>
</body>
</html>
