name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Bramble and its installer
        shell: pwsh
        run: ./src/publish.ps1

      - name: Show the checksum of the installer
        shell: pwsh
        run: Get-FileHash dist/Bramble-Setup-*.exe -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: Bramble-Setup
          path: dist/Bramble-Setup-*.exe
          if-no-files-found: error
