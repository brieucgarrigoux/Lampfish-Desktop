<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Custom wallpaper</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05030a; }
  #bg, #dim, #vignette, canvas { position: fixed; inset: 0; }
  #bg { background-position: center; background-repeat: no-repeat; }
  #dim { background: #000; opacity: 0; pointer-events: none; }
  #vignette { pointer-events: none; }
  canvas { width: 100%; height: 100%; }
  .item { position: fixed; transform: translate(-50%, -50%); }
  #logo { display: block; object-fit: contain; height: auto; }
  #title { font: 600 6vmin/1 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; letter-spacing: -.02em; white-space: nowrap; text-shadow: 0 .4vmin 2vmin rgba(0, 0, 0, .5); }
</style>
</head>
<body>
<div id="bg"></div>
<div id="dim"></div>
<canvas id="fx"></canvas>
<div id="vignette"></div>
<img id="logo" class="item" alt="" hidden>
<div id="title" class="item"></div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const thumbnail = params.has('thumbnail');
  let config = null, light = 1, speed = 1, frozen = false, dirty = true;
  let audio = 0, audioTarget = 0, lastRaw = 0, lastBeat = 0;
  const ripples = [], history = new Array(96).fill(0);

  window.__adjust = (l, v) => { light = Number(l) / 50; speed = Math.pow(2, (Number(v) - 50) / 25); dirty = true; };
  window.__adjust(params.get('light') ?? 50, params.get('speed') ?? 50);
  window.__audio = l => {
    l = Number(l);
    const now = performance.now();
    if (l - lastRaw > .12 && l > .25 && now - lastBeat > 170) { lastBeat = now; if (ripples.length < 8) ripples.push({ age: 0, power: l }); }
    lastRaw = l;
    audioTarget = l;
  };
  addEventListener('message', e => {
    const m = e.data || {};
    if (m.lampfish === 'adjust') window.__adjust(m.light, m.speed);
    if (m.lampfish === 'freeze') { frozen = m.value; dirty = true; }
    if (m.lampfish === 'config') { config = m.config; dirty = true; apply(); }
    if (m.lampfish === 'audio') window.__audio(m.level);
  });
  if (!params.has('preview')) fetch('config.json', { cache: 'no-store' }).then(r => r.json()).then(c => { config = c; apply(); });
  if (parent !== window) parent.postMessage({ lampfish: 'ready' }, '*');

  const $ = id => document.getElementById(id);
  const bg = $('bg'), dim = $('dim'), vignette = $('vignette'), logo = $('logo'), title = $('title');
  const canvas = $('fx'), ctx = canvas.getContext('2d');
  let w = 0, h = 0, particles = [], sprites = new Map(), particleType = '', particleScale = 1, angle = 160, lastDepth = null;

  const num = (v, d) => (v === undefined || v === null || v === '' || isNaN(Number(v))) ? d : Number(v);
  function rgb(c) {
    const m = /^#?([0-9a-f]{6})$/i.exec(c || '');
    const n = m ? parseInt(m[1], 16) : 0x9561f3;
    return [n >> 16, (n >> 8) & 255, n & 255];
  }

  function gradient(a) {
    const b = (config && config.background) || {};
    return `linear-gradient(${a}deg, ${b.color || '#0b0a12'}, ${b.color2 || '#2a1450'})`;
  }

  const FONTS = { sans: '"Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif', serif: 'Georgia, "Times New Roman", serif', spaced: '"Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif' };

  function apply() {
    if (!config) return;
    const b = config.background || {};
    bg.style.backgroundImage = '';
    bg.style.backgroundColor = '';
    if (b.type === 'image' && b.image) {
      bg.style.backgroundColor = b.color || '#05030a';
      bg.style.backgroundImage = `url("${b.image}")`;
      bg.style.backgroundSize = b.fit === 'contain' ? 'contain' : 'cover';
    } else if (b.type === 'gradient') {
      bg.style.backgroundImage = gradient(num(b.angle, 160));
      bg.style.backgroundSize = 'auto';
    } else bg.style.backgroundColor = b.color || '#0b0a12';
    angle = num(b.angle, 160);
    dim.style.opacity = String(Math.max(0, Math.min(.9, num(b.dim, 0) / 100)));
    const v = Math.max(0, Math.min(100, num(b.vignette, 0))) / 100;
    vignette.style.background = v > 0 ? `radial-gradient(ellipse closest-side at 50% 50%, rgba(0,0,0,0) 38%, rgba(0,0,0,${(v * .9).toFixed(2)}) 100%)` : 'none';

    const l = config.logo || {};
    if (l.image) { logo.src = l.image; logo.hidden = false; } else { logo.removeAttribute('src'); logo.hidden = true; }
    logo.style.width = num(l.size, 28) + 'vmin';
    logo.style.left = num(l.x, 50) + '%';
    logo.style.top = num(l.y, 45) + '%';
    const sh = typeof l.shadow === 'number' ? l.shadow : l.shadow === false ? 0 : 60, sk = sh / 60;
    logo.style.filter = sh > 0 ? `drop-shadow(0 ${(.6 * sk).toFixed(2)}vmin ${(2.2 * sk).toFixed(2)}vmin rgba(0,0,0,${Math.min(.9, .45 * sk).toFixed(2)}))` : 'none';

    const t = config.title || {};
    title.textContent = t.text || '';
    title.style.fontSize = num(t.size, 6) + 'vmin';
    const font = FONTS[t.font] ? t.font : 'sans';
    title.style.fontFamily = FONTS[font];
    title.style.fontWeight = String(font === 'spaced' ? Math.min(num(t.weight, 600), 500) : num(t.weight, 600));
    title.style.letterSpacing = font === 'spaced' ? '.34em' : font === 'serif' ? '0' : '-.02em';
    title.style.textTransform = font === 'spaced' ? 'uppercase' : 'none';
    title.style.color = t.color || '#ece7f4';
    title.style.left = num(t.x, 50) + '%';
    title.style.top = num(t.y, 66) + '%';
    layoutCanvas();
    const pc = config.particles || {};
    particleScale = num(pc.size, 100) / 100;
    buildParticles(pc.type !== particleType);
    particleType = pc.type;
  }

  function sprite(color, hard) {
    const key = color + hard;
    if (sprites.has(key)) return sprites.get(key);
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d'), [r, gr, b] = rgb(color);
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, `rgba(${r},${gr},${b},1)`);
    grad.addColorStop(hard, `rgba(${r},${gr},${b},.55)`);
    grad.addColorStop(1, `rgba(${r},${gr},${b},0)`);
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    sprites.set(key, c);
    return c;
  }

  const KINDS = {
    fireflies: {
      density: 1 / 26000,
      make: (s, k) => ({ x: Math.random() * w, y: Math.random() * h, r: (3 + Math.random() * 6) * s, ph: Math.random() * 6.28, sp: .12 + Math.random() * .3, a: Math.random() * 6.28 }),
      step(p, dt, t, k) { p.x += Math.sin(t * p.sp + p.a) * 16 * dt * k; p.y += (Math.cos(t * p.sp * .8 + p.a) * 11 - 2.5) * dt * k; wrap(p, 30); },
      draw(p, t, c, pulse) { const a = (.18 + .82 * Math.pow(.5 + .5 * Math.sin(t * 1.5 + p.ph), 2)) * (1 + pulse * .8); put(sprite(c, .18), p.x, p.y, p.r * 4, Math.min(1, a)); put(sprite('#ffffff', .1), p.x, p.y, p.r * .9, Math.min(1, a * .8)); },
      sharp(p, t, c, pulse) { const a = Math.min(1, (.25 + .75 * Math.pow(.5 + .5 * Math.sin(t * 1.5 + p.ph), 2)) * (1 + pulse * .8)); put(halo(c), p.x, p.y, p.r * 2.6, a * .55); dot(p.x, p.y, p.r * .38, '#F2FFFC', a); },
    },
    stars: {
      density: 1 / 9000,
      make: (s) => ({ x: Math.random() * w, y: Math.random() * h, r: (.5 + Math.pow(Math.random(), 3) * 2.2) * s, ph: Math.random() * 6.28, sp: .4 + Math.random() * 1.6 }),
      step() { },
      draw(p, t, c, pulse) {
        const a = .3 + .7 * (.5 + .5 * Math.sin(t * p.sp + p.ph));
        put(sprite(c, .12), p.x, p.y, p.r * 3.6, Math.min(1, a * (1 + pulse * .6)));
        if (p.r > 1.9) {
          ctx.globalAlpha = a * .45;
          ctx.fillStyle = c; ctx.fillRect(p.x - p.r * 5, p.y - .4, p.r * 10, .8); ctx.fillRect(p.x - .4, p.y - p.r * 5, .8, p.r * 10);
          ctx.globalAlpha = 1;
        }
      },
      sharp(p, t, c, pulse) {
        const a = Math.min(1, (.35 + .65 * (.5 + .5 * Math.sin(t * p.sp + p.ph))) * (1 + pulse * .6));
        put(halo(c), p.x, p.y, p.r * 2.4, a * .45); dot(p.x, p.y, Math.max(.6, p.r * .45), '#F2FFFC', a);
        if (p.r > 1.9) {
          const px = 1 / (devicePixelRatio || 1), x = Math.round(p.x / px) * px, y = Math.round(p.y / px) * px;
          ctx.globalAlpha = a * .5; ctx.fillStyle = c; ctx.fillRect(x - p.r * 5, y, p.r * 10, px); ctx.fillRect(x, y - p.r * 5, px, p.r * 10); ctx.globalAlpha = 1;
        }
      },
    },
    embers: {
      density: 1 / 24000,
      make: (s, k, init) => ({ x: Math.random() * w, y: init ? Math.random() * h : h + 20, vy: 26 + Math.random() * 60, r: (1.4 + Math.random() * 2.6) * s, ph: Math.random() * 6.28, life: init ? Math.random() : 1 }),
      step(p, dt, t, k) { p.y -= p.vy * dt * k; p.x += Math.sin(t * .9 + p.ph) * 22 * dt * k; p.life -= dt * .11 * k; if (p.life <= 0 || p.y < -20) Object.assign(p, this.make(1, 1, false)); },
      draw(p, t, c, pulse) { const a = Math.max(0, p.life) * (.55 + .45 * Math.sin(t * 7 + p.ph)); put(sprite(c, .16), p.x, p.y, p.r * 4.2 * (.5 + p.life * .5), Math.min(1, a * (1 + pulse))); put(sprite('#fff3d6', .1), p.x, p.y, p.r * .8, Math.min(1, a)); },
      sharp(p, t, c, pulse) { const a = Math.min(1, Math.max(0, p.life) * 1.2 * (.7 + .3 * Math.sin(t * 5 + p.ph)) * (1 + pulse)); const r = p.r * (.6 + p.life * .4); put(halo(c), p.x, p.y, r * 3.2, a * .5); dot(p.x, p.y, Math.max(.7, r * .55), '#F2FFFC', a); },
    },
    snow: {
      density: 1 / 11000,
      make: (s, k, init) => ({ x: Math.random() * w, y: init ? Math.random() * h : -10, vy: 12 + Math.random() * 26, r: (.9 + Math.random() * 2.6) * s, ph: Math.random() * 6.28 }),
      step(p, dt, t, k) { p.y += p.vy * dt * k; p.x += Math.sin(t * .5 + p.ph) * 10 * dt * k; if (p.y > h + 10) { p.y = -10; p.x = Math.random() * w; } },
      draw(p, t, c, pulse) { put(sprite(c, .35), p.x, p.y, p.r * 2.4, Math.min(1, .22 + p.r * .13 + pulse * .2)); },
      sharp(p, t, c, pulse) { const a = Math.min(1, .35 + p.r * .14 + pulse * .2); put(halo(c), p.x, p.y, p.r * 1.8, a * .35); dot(p.x, p.y, p.r * .7, c, a); },
    },
    bubbles: {
      density: 1 / 30000,
      make: (s, k, init) => ({ x: Math.random() * w, y: init ? Math.random() * h : h + 20, vy: 22 + Math.random() * 40, r: (1.6 + Math.random() * 3.4) * s, ph: Math.random() * 6.28 }),
      step(p, dt, t, k) { p.y -= p.vy * dt * k; p.x += Math.sin(t * 1.6 + p.ph) * 9 * dt * k; if (p.y < -20) { p.y = h + 20; p.x = Math.random() * w; } },
      draw(p, t, c, pulse) { bubble(p.x, p.y, p.r * 1.2, c, Math.min(1, .55 + pulse * .4)); },
      sharp(p, t, c, pulse) { bubble(p.x, p.y, p.r * 1.2, c, Math.min(1, .6 + pulse * .4)); },
    },
    marine: {
      density: 1 / 9000,
      make: (s, k, init) => ({ x: Math.random() * w, y: init ? Math.random() * h : -10, vy: 5 + Math.random() * 12, r: (.6 + Math.pow(Math.random(), 2) * 2) * s, ph: Math.random() * 6.28 }),
      step(p, dt, t, k) { p.y += p.vy * dt * k; p.x += Math.sin(t * .35 + p.ph) * 7 * dt * k; if (p.y > h + 10) { p.y = -10; p.x = Math.random() * w; } },
      draw(p, t, c, pulse) { const a = .25 + .3 * (.5 + .5 * Math.sin(t * .7 + p.ph)); put(sprite(c, .4), p.x, p.y, p.r * 2, Math.min(1, a + pulse * .2)); },
      sharp(p, t, c, pulse) { const a = .35 + .35 * (.5 + .5 * Math.sin(t * .7 + p.ph)); dot(p.x, p.y, p.r * .7, c, Math.min(1, a + pulse * .2)); },
    },
    orbs: {
      density: 1 / 90000,
      make: (s, k, init) => ({ x: Math.random() * w, y: init ? Math.random() * h : h + 80, r: (22 + Math.random() * 70) * s, vy: 4 + Math.random() * 9, ph: Math.random() * 6.28, a: .05 + Math.random() * .1 }),
      step(p, dt, t, k) { p.y -= p.vy * dt * k; p.x += Math.sin(t * .2 + p.ph) * 6 * dt * k; if (p.y < -p.r * 2) { p.y = h + p.r * 2; p.x = Math.random() * w; } },
      draw(p, t, c, pulse) { put(sprite(c, .05), p.x, p.y, p.r, Math.min(.5, p.a * (1 + pulse * 2.2) * (.8 + .2 * Math.sin(t * .8 + p.ph)))); },
    },
  };

  // The look with depth: a halo from a 128 px image (soft anyway), a core drawn as a vector at the size of the screen.
  function halo(color) {
    const key = 'halo' + color;
    if (sprites.has(key)) return sprites.get(key);
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const g = c.getContext('2d'), [r, gr, b] = rgb(color), q = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    q.addColorStop(0, `rgba(${r},${gr},${b},.9)`); q.addColorStop(.35, `rgba(${r},${gr},${b},.32)`); q.addColorStop(1, `rgba(${r},${gr},${b},0)`);
    g.fillStyle = q; g.fillRect(0, 0, 128, 128);
    sprites.set(key, c);
    return c;
  }
  // Out of focus, close to the eye: an even disc with a soft edge.
  function bokeh(color) {
    const key = 'bokeh' + color;
    if (sprites.has(key)) return sprites.get(key);
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const g = c.getContext('2d'), [r, gr, b] = rgb(color), q = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    q.addColorStop(0, `rgba(${r},${gr},${b},.85)`); q.addColorStop(.62, `rgba(${r},${gr},${b},.6)`); q.addColorStop(1, `rgba(${r},${gr},${b},0)`);
    g.fillStyle = q; g.fillRect(0, 0, 128, 128);
    sprites.set(key, c);
    return c;
  }
  function dot(x, y, r, color, a) { ctx.globalAlpha = a; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); }
  function bubble(x, y, r, color, a) {
    ctx.globalAlpha = a * .8; ctx.strokeStyle = color; ctx.lineWidth = Math.max(.8, r * .18); ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.stroke();
    ctx.globalAlpha = a * .7; ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x - r * .35, y - r * .35, r * .25, 0, 6.283); ctx.fill();
  }
  // Three planes: far (tiny, pale, slow), middle (sharp), near (large, soft, fast). depth (0 to 1) sets how many leave the middle.
  const PLANES = [{ v: .35, r: .45, a: .5 }, { v: 1, r: 1, a: 1 }, { v: 1.9, r: 4.2, a: .17 }];
  function plane(depth) { const u = Math.random(); return u < depth * .55 ? 0 : u > 1 - depth * .12 ? 2 : 1; }
  function drawDeep(kind, p, t, c, pulse) {
    const z = p.z, pl = PLANES[z];
    if (z === 1) return (kind.sharp || kind.draw).call(kind, p, t, c, pulse);
    const tw = .7 + .3 * Math.sin(t * (1.2 + z) + p.ph);
    if (z === 0) dot(p.x, p.y, Math.max(.5, p.r * pl.r), c, Math.min(1, pl.a * tw * (1 + pulse * .5)));
    else put(bokeh(c), p.x, p.y, p.r * pl.r, Math.min(1, pl.a * tw * (1 + pulse)));
  }

  function wrap(p, m) { if (p.x < -m) p.x = w + m; if (p.x > w + m) p.x = -m; if (p.y < -m) p.y = h + m; if (p.y > h + m) p.y = -m; }
  function put(img, x, y, r, a) { ctx.globalAlpha = a; ctx.drawImage(img, x - r, y - r, r * 2, r * 2); }

  function layoutCanvas() {
    const r = devicePixelRatio || 1;
    w = innerWidth; h = innerHeight;
    canvas.width = Math.round(w * r); canvas.height = Math.round(h * r);
    ctx.setTransform(r, 0, 0, r, 0, 0);
  }

  function resize() { layoutCanvas(); buildParticles(false); }

  // Size is applied when drawing and the amount only adds or removes particles, so moving a slider never reshuffles the ones on screen.
  function buildParticles(fresh) {
    const pc = (config && config.particles) || {}, kind = KINDS[pc.type];
    if (!kind) { particles = []; return; }
    if (fresh) particles = [];
    const count = Math.min(900, Math.round(w * h * kind.density * num(pc.amount, 50) / 50));
    const depth = typeof pc.depth === 'number' ? Math.max(0, Math.min(100, pc.depth)) / 100 : null;
    while (particles.length < count) { const p = kind.make(1, 1, true); if (depth !== null) p.z = plane(depth); particles.push(p); }
    particles.length = Math.min(particles.length, count);
    if (depth !== null && depth !== lastDepth) for (const p of particles) p.z = plane(depth);
    lastDepth = depth;
  }

  let t = 0, before = performance.now(), frames = 0, historyClock = 0;
  function draw(now) {
    if (innerWidth !== w || innerHeight !== h) { resize(); dirty = true; }
    if (frozen && !dirty && Math.abs(audioTarget - audio) < .002) { setTimeout(() => requestAnimationFrame(draw), 250); return; }
    if (now - before < 1000 / 62) { requestAnimationFrame(draw); return; }
    dirty = false;
    const dt = Math.min(.05, (now - before) / 1000);
    before = now;
    audio += (audioTarget - audio) * Math.min(1, dt * 14);
    if (!frozen) t += dt * speed;

    const c = config || {}, pc = c.particles || {}, gl = c.glow || {}, l = c.logo || {}, b = c.background || {};
    const so = c.sound || {}, on = so.on !== false;
    const flags = ['pulse', 'ripples', 'ring', 'vibe'].some(k => k in so);
    const fx = { pulse: on && (flags ? so.pulse !== false : true), ripples: on && (flags ? !!so.ripples : so.style === 'ripples'), ring: on && (flags ? !!so.ring : so.style === 'ring'), vibe: on && !!so.vibe, particles: on && so.particles !== false };
    const pulse = fx.pulse ? audio : 0, pulseP = fx.particles ? audio : 0;
    const drift = typeof b.drift === 'number' ? b.drift : b.drift ? 40 : 0;
    if (drift > 0 && b.type === 'gradient' && !frozen) bg.style.backgroundImage = gradient((angle + t * drift / 100 * 14) % 360);
    const cx = w * num(l.x, 50) / 100, cy = h * num(l.y, 45) / 100;
    const logoRadius = Math.min(w, h) * num(l.size, 28) / 200;
    ctx.clearRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';

    if (gl.on !== false && gl.on !== undefined) {
      const strength = num(gl.strength, 60) / 60, [r, g, b] = rgb(gl.color || '#9561f3');
      const breathe = .85 + Math.sin(t * .9) * .15;
      const radius = Math.min(w, h) * .46 * breathe * (1 + pulse * .6);
      const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
      halo.addColorStop(0, `rgba(${r},${g},${b},${Math.min(1, .42 * strength * Math.min(1.6, light) * (1 + pulse * 1.6))})`);
      halo.addColorStop(.55, `rgba(${r},${g},${b},${Math.min(1, .14 * strength * Math.min(1.6, light))})`);
      halo.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.globalAlpha = 1;
      ctx.fillStyle = halo;
      ctx.fillRect(0, 0, w, h);
    }

    const kind = KINDS[pc.type];
    if (kind) {
      const k = (frozen ? 0 : speed * num(pc.speed, 100) / 100) * (1 + pulseP * 3), color = pc.color || '#c9a2e6';
      // A wallpaper made before the depth existed keeps the drawing it was made with.
      const deep = typeof pc.depth === 'number';
      for (const p of particles) {
        kind.step(p, dt, t, deep && p.z !== undefined ? k * PLANES[p.z].v : k);
        const r = p.r; p.r = r * particleScale;
        if (deep && p.z !== undefined) drawDeep(kind, p, t, color, pulseP); else kind.draw(p, t, color, pulseP);
        p.r = r;
      }
      ctx.globalAlpha = 1;
    }
    ctx.globalCompositeOperation = 'source-over';

    if (fx.ring || fx.ripples) {
      const [r, g, bl] = rgb(so.color || gl.color || '#c9a2e6'), rgbText = so.color ? `${r},${g},${bl}` : `${Math.min(255, r + 70)},${Math.min(255, g + 70)},${Math.min(255, bl + 70)}`;
      if (fx.ring) ring(dt, cx, cy, logoRadius * 1.35, rgbText);
      if (fx.ripples) ripple(dt, cx, cy, logoRadius * 1.05, rgbText);
    }

    if (logo.src && !logo.hidden) {
      const bob = l.float === false ? 0 : Math.sin(t * .7) * .6;
      const shake = fx.vibe ? audio * (num(so.vibeAmount, 50) / 50) : 0;
      const jx = (Math.random() - .5) * shake * 9, jy = (Math.random() - .5) * shake * 9;
      logo.style.transform = `translate(calc(-50% + ${jx.toFixed(1)}px), calc(-50% + ${(jy + bob * h / 100).toFixed(1)}px)) scale(${(1 + pulse * .05).toFixed(3)})`;
    }
    if (fx.vibe && title.textContent) title.style.transform = `translate(calc(-50% + ${((Math.random() - .5) * audio * 5 * num(so.vibeAmount, 50) / 50).toFixed(1)}px), calc(-50% + ${((Math.random() - .5) * audio * 5 * num(so.vibeAmount, 50) / 50).toFixed(1)}px))`;
    else title.style.transform = '';

    if (thumbnail && ++frames > 2) return;
    requestAnimationFrame(draw);
  }

  function ripple(dt, cx, cy, base, rgbText) {
    if (audio > .02) {
      ctx.beginPath(); ctx.arc(cx, cy, base * (1.08 + audio * .12), 0, 6.283);
      ctx.strokeStyle = `rgba(${rgbText},${(.08 + audio * .32).toFixed(3)})`; ctx.lineWidth = 1.5; ctx.stroke();
    }
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.age += dt;
      const k = r.age / 1.5;
      if (k >= 1) { ripples.splice(i, 1); continue; }
      const eased = 1 - Math.pow(1 - k, 3);
      ctx.beginPath(); ctx.arc(cx, cy, base * (1.1 + eased * (1.6 + r.power)), 0, 6.283);
      ctx.strokeStyle = `rgba(${rgbText},${((1 - k) * (.22 + r.power * .4)).toFixed(3)})`; ctx.lineWidth = 1 + (1 - k) * 2.2 * r.power; ctx.stroke();
    }
  }

  function ring(dt, cx, cy, base, rgbText) {
    historyClock += dt;
    if (historyClock > .033) { historyClock = 0; history.push(audio); history.shift(); }
    const n = 96, amps = [], pts = [];
    for (let i = 0; i < n; i++) {
      const fold = i < n / 2 ? i : n - 1 - i;
      amps.push(history[history.length - 1 - Math.floor(fold / (n / 2) * (history.length - 1))] || 0);
    }
    for (let i = 0; i < n; i++) {
      let s = 0;
      for (let k = -2; k <= 2; k++) s += amps[(i + k + n) % n];
      const shaped = Math.pow(s / 5, .7), a = i / n * 6.2832 - 1.5708, r = base * (1 + shaped * .5 + .008 * Math.sin(t * 1.1 + i * .3));
      pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const p = pts[i], q = pts[(i + 1) % n];
      if (i === 0) ctx.moveTo((pts[n - 1][0] + p[0]) / 2, (pts[n - 1][1] + p[1]) / 2);
      ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
    }
    ctx.closePath();
    ctx.fillStyle = `rgba(${rgbText},${(.025 + audio * .05).toFixed(3)})`; ctx.fill();
    ctx.shadowColor = `rgba(${rgbText},.7)`; ctx.shadowBlur = 10 + audio * 12;
    ctx.strokeStyle = `rgba(${rgbText},${(.3 + audio * .5).toFixed(3)})`; ctx.lineWidth = 1.4 + audio * 1.2; ctx.stroke();
    ctx.shadowBlur = 0;
  }

  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
})();
</script>
