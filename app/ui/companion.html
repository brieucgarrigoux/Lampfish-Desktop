<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://shelf.example; base-uri 'none'; form-action 'none'">
<title>Bramble</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="main.css">
<link rel="stylesheet" href="companion.css">
</head>
<body class="companion">
  <header class="c-head">
    <img class="c-logo" src="/brand/logo/logo-bramble-192.png" alt="">
    <span class="c-time" id="c-time"></span>
    <button type="button" class="c-close" id="c-close" title="Close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
  </header>
  <nav class="segments c-tabs" role="tablist" aria-label="Companion">
    <button type="button" role="tab" data-tab="note" aria-selected="true">Note</button>
    <button type="button" role="tab" data-tab="capture" aria-selected="false">Capture</button>
    <button type="button" role="tab" data-tab="dashboard" aria-selected="false">Dashboard</button>
  </nav>

  <section class="c-pane" data-pane="note">
    <input type="text" class="c-title" id="c-title" placeholder="Title (optional)" aria-label="Title" spellcheck="false">
    <textarea class="c-text" id="c-text" placeholder="Write here, in Markdown" aria-label="Note"></textarea>
    <div class="c-row"><span class="c-hint" id="c-saved" aria-live="polite">Ctrl + Enter saves</span><button type="button" class="link" id="c-notes">Open Notes</button><button type="button" class="button button--accent" id="c-save">Save</button></div>
  </section>

  <section class="c-pane" data-pane="capture" hidden>
    <button type="button" class="c-big" data-capture="0"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/></svg><span>Zone or window<small>Drag a zone, or click a window</small></span></button>
    <button type="button" class="c-big" data-capture="3"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2M10 2.5h4"/></svg><span>In 3 seconds<small>Time to open a menu first</small></span></button>
    <button type="button" class="c-big" data-capture="whole"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="12" rx="1.5"/><path d="M9 20h6M12 16.5V20"/></svg><span>Whole screen<small>The screen under the pointer</small></span></button>
    <div class="c-subhead"><span>Last captures</span><button type="button" class="link" id="c-shelf">Open Shelf</button></div>
    <div class="c-shots" id="c-shots"></div>
  </section>

  <section class="c-pane" data-pane="dashboard" hidden>
    <div class="c-gauges">
      <div class="c-gauge" id="c-cpu"><span class="c-ring"><b></b></span><span class="c-label">Processor</span><small class="c-mostly" translate="no"></small></div>
      <div class="c-gauge" id="c-ram"><span class="c-ring"><b></b></span><span class="c-label">Memory</span><small></small></div>
    </div>
    <div class="c-lines" id="c-lines"></div>
    <div class="c-subhead"><span>Last notes</span><button type="button" class="link" id="c-open">Open Bramble</button></div>
    <div class="c-notes" id="c-recent"></div>
  </section>

  <footer class="c-claude" id="c-claude" hidden>
    <span class="c-claude__name">Claude</span>
    <span class="c-bar"><i id="c-claude-bar"></i></span>
    <span class="c-claude__text" id="c-claude-text"></span>
  </footer>
<script src="base.js"></script>
<script src="companion.js"></script>
</body>
</html>
