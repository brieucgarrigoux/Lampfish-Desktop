<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; font-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; base-uri 'none'; form-action 'none'">
<title>Annotate</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="main.css">
<link rel="stylesheet" href="annotate.css">
<link rel="stylesheet" href="light.css">
</head>
<body class="annotate">
  <header class="an-bar">
    <div class="segments an-tools" id="an-tools" role="radiogroup" aria-label="Tool"></div>
    <div class="an-colors" role="radiogroup" aria-label="Color">
      <button type="button" role="radio" data-color="#0F9D8F" aria-checked="true" aria-label="Turquoise" title="Turquoise"></button>
      <button type="button" role="radio" data-color="#ff5c6c" aria-checked="false" aria-label="Red" title="Red"></button>
      <button type="button" role="radio" data-color="#f0b955" aria-checked="false" aria-label="Yellow" title="Yellow"></button>
      <button type="button" role="radio" data-color="#4aa8ff" aria-checked="false" aria-label="Blue" title="Blue"></button>
      <button type="button" role="radio" data-color="#ffffff" aria-checked="false" aria-label="White" title="White"></button>
    </div>
    <div class="segments an-sizes" role="radiogroup" aria-label="Thickness">
      <button type="button" role="radio" data-size=".6" aria-checked="false" aria-label="Thin" title="Thin"><i></i></button>
      <button type="button" role="radio" data-size="1" aria-checked="true" aria-label="Medium" title="Medium"><i></i></button>
      <button type="button" role="radio" data-size="1.7" aria-checked="false" aria-label="Thick" title="Thick"><i></i></button>
    </div>
    <button type="button" class="an-undo" id="an-undo" title="Undo (Ctrl + Z)" aria-label="Undo" disabled><svg class="ph" aria-hidden="true"><use href="icons.svg#arrow-u-up-left"/></svg></button>
    <span class="an-space"></span>
    <button type="button" class="link an-delete" id="an-delete"><svg class="ph" aria-hidden="true"><use href="icons.svg#trash-simple"/></svg>Delete the capture</button>
    <button type="button" class="button" id="an-close" title="Escape"><svg class="ph" aria-hidden="true"><use href="icons.svg#x"/></svg>Close</button>
    <button type="button" class="button button--accent" id="an-done" title="Ctrl + S"><svg class="ph" aria-hidden="true"><use href="icons.svg#copy"/></svg>Copy and close</button>
  </header>
  <div class="an-hint" id="an-hint" aria-live="polite"></div>
  <main class="an-stage" id="an-stage">
    <canvas id="an-canvas" aria-label="Capture"></canvas>
    <input type="text" class="an-text" id="an-text" hidden aria-label="Text to add" spellcheck="false">
  </main>
<script src="base.js"></script>
<script src="annotate.js"></script>
</body>
</html>
